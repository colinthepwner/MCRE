    <meta name="mcre-build" content="dev">
    <title>Minecraft RE</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            /* Prevent browser scroll/zoom on touch */
        }

        canvas.emscripten {
            /* Pinned to the visible window. 100vw/100vh is the *large* viewport on phones (as
               if the address bar were hidden), which differs from what's actually on screen,
               so the picture was stretched or pushed off-centre. The C++ side sizes the
               drawing buffer from this element's real size (see the resize sync below). */
            display: block;
            outline: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #mc-rotate {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font: 18px/1.4 monospace;
            text-align: center;
            padding: 24px;
        }

        /* The menu dirt behind everything until the game has shown its title screen (user
           2026-10-16: "should use the actual minecraft dirt texture"). It is the game's own
           gui/background.png, served next to the page as icons/dirt.png (index.data isn't here
           yet), drawn exactly like Screen::renderDirtBackground: the texel times the vertex
           colour 0x404040 (the multiply blend over #404040 is that product) and one tile per 32
           GUI units from the top-left corner, at the GUI scale the game is going to pick
           (--mc-dirt-size, from mcDirtTile below). So the dirt doesn't move or change shade
           when the title screen's own dirt replaces it.
           On the body as well as on the loading screen (#mcLoading): the body is what shows in
           the first paint, before the loading screen's script has run (it sits ~1500 lines
           into this page), and wherever the canvas has nothing in it yet - it was black there.
           Back to black once the loading screen is gone (html.mc-loading): in a world, pixels
           the game leaves with alpha < 1 show the page through, and that must stay black.
           mc-nodirt: the picture didn't load - a plain colour, the average of the tinted dirt. */
        html.mc-loading body,
        #mcLoading {
            background: #404040 url(icons/dirt.png) 0 0 / var(--mc-dirt-size, 64px 64px) repeat;
            background-blend-mode: multiply;
            image-rendering: pixelated;
        }

        html.mc-loading.mc-nodirt body,
        html.mc-nodirt #mcLoading {
            background: #221811;
        }
    </style>
    <script>
        (function () {
            var root = document.documentElement;
            root.classList.add('mc-loading');
            function ratio() {
                var dpr = window.devicePixelRatio || 1, o = 0;
                try {
                    o = (window.Module && Module.mcRenderScaleOption != null) ? (Module.mcRenderScaleOption | 0)
                        : (parseInt(localStorage.getItem('mcre.renderScale'), 10) || 0);
                } catch (e) { }
                if (o === 0) {
                    var phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                    return phone ? Math.max(1, dpr * 0.5) : dpr;
                }
                return dpr * ([1, 1, 0.75, 0.5, 0.35][o] || 1);
            }
            window.mcDirtTile = function () {
                if (!root.classList.contains('mc-loading')) return;
                var c = document.getElementById('canvas'), r = c && c.getBoundingClientRect();
                var W = (r && r.width) || window.innerWidth, H = (r && r.height) || window.innerHeight;
                var k = ratio(), bw = Math.round(W * k), bh = Math.round(H * k);
                if (bw < 1 || bh < 1) return;
                var touch = (window.Module && Module._mcIsTouchMode) ? !!Module._mcIsTouchMode()
                    : !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                var s;
                if (!touch) s = Math.max(1, Math.floor(bh / 400 + 0.5));
                else {
                    s = Math.max(1, Math.floor(bh / 190 + 0.5));
                    while (s > 1 && Math.floor(bw / s) < 400) --s;
                }
                var inv = Math.fround(1 / s);
                var gw = Math.floor(Math.fround(bw * inv)), gh = Math.floor(Math.fround(bh * inv));
                if (gw < 1 || gh < 1) return;
                root.style.setProperty('--mc-dirt-size', (32 * W / gw) + 'px ' + (32 * H / gh) + 'px');
                window.mcGuiUnitCss = W / gw;
                if (window.mcModPanelResize) window.mcModPanelResize();
            };
            window.mcDirtTile();
            window.addEventListener('resize', window.mcDirtTile);
            document.addEventListener('DOMContentLoaded', window.mcDirtTile);
            var probe = new Image();
            probe.onerror = function () { root.classList.add('mc-nodirt'); };
            probe.src = 'icons/dirt.png';
        })();
    </script>
</head>

            var appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent)
                || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
            function canThread() {
                if (/[?&]mt=0(&|$)/.test(query)) return false;
                if (appleTouch && !/[?&]mt=1(&|$)/.test(query)) return false;
                if (!window.crossOriginIsolated) return false;
                if (typeof SharedArrayBuffer !== 'function' || typeof Atomics !== 'object') return false;
                try {
                    var mem = new WebAssembly.Memory({ initial: 1, maximum: 2, shared: true });
                    if (typeof mem.toResizableBuffer !== 'function') return false;
                    mem.toResizableBuffer();
                } catch (e) { return false; }
                return !recentFailure();
            }
            function add(src, onFail) {
                var el = document.createElement('script');
                el.src = src + (typeof MCRE_V === 'string' ? MCRE_V : '');
                el.async = true;
                if (onFail) el.onerror = onFail;
                document.body.appendChild(el);
            }

            if (!canThread()) {
                Module.mcThreaded = 0;
                add(normal);
                return;
            }
            var cores = navigator.hardwareConcurrency || 2;
            var phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            Module.mcMeshThreads = Math.max(1, Math.min(phone ? 2 : 3, cores - 1));
            Module.mcThreaded = 1;

            var started = false, settled = false;
            Module.postRun = Module.postRun || [];
            if (typeof Module.postRun === 'function') Module.postRun = [Module.postRun];
            Module.postRun.push(function () { started = true; });
            function giveUp(why) {
                if (started || settled) return;
                settled = true;
                console.warn('Threaded build failed to start (' + why + '); switching to the normal build.');
                try { localStorage.setItem(FAIL_KEY, String(Date.now())); } catch (e) { }
                location.reload();
            }
            var prevAbort = Module.onAbort;
            Module.onAbort = function (what) {
                if (prevAbort) { try { prevAbort(what); } catch (e) { } }
                giveUp('abort: ' + what);
            };
            window.addEventListener('error', function (e) {
                if (e && e.filename && e.filename.indexOf(threaded) !== -1) giveUp(e.message || 'error');
            });
            var STALL_MS = 30000;
            var lastProgress = Date.now();
            function progress() { lastProgress = Date.now(); }
            var prevStatus = Module.setStatus;
            Module.setStatus = function (text) {
                progress();
                if (prevStatus) return prevStatus.apply(this, arguments);
            };
            var prevDeps = Module.monitorRunDependencies;
            Module.monitorRunDependencies = function (left) {
                progress();
                if (prevDeps) return prevDeps.apply(this, arguments);
            };
            var watchdog = setInterval(function () {
                if (started || settled) { clearInterval(watchdog); return; }
                if (Date.now() - lastProgress > STALL_MS) {
                    clearInterval(watchdog);
                    giveUp('no progress for ' + (STALL_MS / 1000) + ' s');
                }
            }, 1000);
            add(threaded, function () {
                if (started || settled) return;
                settled = true;
                Module.mcThreaded = 0;
                add(normal);
            });
        })();
    </script>
