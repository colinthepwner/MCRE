<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="mcre-build" content="dev">
    <title>Minecraft RE</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            /* Prevent browser scroll/zoom on touch */
        }

        canvas.emscripten {
            /* Pinned to the visible window. 100vw/100vh is the *large* viewport on phones (as
               if the address bar were hidden), which differs from what's actually on screen,
               so the picture was stretched or pushed off-centre. The C++ side sizes the
               drawing buffer from this element's real size (see the resize sync below). */
            display: block;
            outline: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #mc-rotate {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font: 18px/1.4 monospace;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })()
        };

        var MCRE_BUILD = (function () {
            var m = document.querySelector('meta[name="mcre-build"]');
            return (m && m.getAttribute('content')) || 'dev';
        })();
        Module.mcBuild = MCRE_BUILD;
        var MCRE_V = MCRE_BUILD === 'dev' ? '' : '?v=' + encodeURIComponent(MCRE_BUILD);
        Module.locateFile = function (path, prefix) { return (prefix || '') + path + (/[?]/.test(path) ? '' : MCRE_V); };
        (function checkForUpdate() {
            if (MCRE_BUILD === 'dev' || !window.fetch) return;
            var shown = false, last = 0;
            function check() {
                var now = Date.now();
                if (shown || now - last < 60000) return;
                last = now;
                fetch('./?mcre-check=' + now, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (html) {
                    var m = /<meta\b[^>]*\bname=["']?mcre-build["']?[^>]*\bcontent=["']([^"']+)["']/i.exec(html) ||
                            /<meta\b[^>]*\bcontent=["']([^"']+)["'][^>]*\bname=["']?mcre-build\b/i.exec(html);
                    if (!m || m[1] === MCRE_BUILD || m[1] === 'dev' || shown) return;
                    shown = true;
                    var bar = document.createElement('div');
                    bar.style.cssText = 'position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.8);' +
                        'color:#fff;font:13px sans-serif;padding:6px 10px;border:1px solid #888;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)';
                    var text = document.createElement('span');
                    text.textContent = 'A new version (' + m[1] + ') is out.';
                    var go = document.createElement('button');
                    go.textContent = 'Reload';
                    go.style.cssText = 'font:inherit;padding:2px 8px;cursor:pointer';
                    go.onclick = function () { location.reload(); };
                    var later = document.createElement('button');
                    later.textContent = 'Later';
                    later.style.cssText = go.style.cssText;
                    later.onclick = function () { bar.remove(); };
                    bar.appendChild(text); bar.appendChild(go); bar.appendChild(later);
                    document.body.appendChild(bar);
                }).catch(function () { });
            }
            setTimeout(check, 30000);
            setInterval(check, 15 * 60000);
            document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
        })();
        (function () {
            var tag = document.createElement('div');
            tag.textContent = MCRE_BUILD;
            tag.style.cssText = 'position:fixed;left:4px;bottom:2px;font:10px monospace;color:rgba(255,255,255,.5);' +
                'text-shadow:1px 1px 0 rgba(0,0,0,.6);pointer-events:none;user-select:none;z-index:5';
            document.body.appendChild(tag);
        })();

        Module.mcPixelRatio = function () {
            var dpr = window.devicePixelRatio || 1;
            var o = Module.mcRenderScaleOption | 0;
            if (o === 0) {
                var phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                return phone ? Math.max(1, dpr * 0.5) : dpr;
            }
            return dpr * ([1, 1, 0.75, 0.5, 0.35][o] || 1);
        };

        (function () {
            var canvas = document.getElementById('canvas');
            var wanted = false;
            var disabled = false;
            var swallowUp = -1;
            var clickAttemptAt = 0;
            var failures = 0, firstFailureAt = 0;
            var hint = null;

            var exitAsked = false;
            var escHeld = false, escDownAt = -1e9;
            var lockAfterEsc = false;
            var lockAskedAt = 0;
            var unlockedAt = -1e9, unlockFlagged = false;
            if (document.exitPointerLock) {
                var nativeExit = document.exitPointerLock;
                document.exitPointerLock = function () {
                    if (document.pointerLockElement) exitAsked = true;
                    return nativeExit.apply(document, arguments);
                };
            }
            window.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape' || e.repeat) return;
                escHeld = true;
                escDownAt = Date.now();
            }, true);
            window.addEventListener('keyup', function (e) {
                if (e.key !== 'Escape') return;
                if (!escHeld && !unlockFlagged && Date.now() - unlockedAt < 1500) {
                    unlockFlagged = true;
                    Module.mcLockLostByPlayer = 1;
                }
                escHeld = false;
                if (lockAfterEsc) {
                    lockAfterEsc = false;
                    setTimeout(tryLock, 0);
                }
            }, true);
            window.addEventListener('blur', function () { escHeld = false; lockAfterEsc = false; });

            function supported() {
                return !disabled && 'pointerLockElement' in document && !!canvas.requestPointerLock;
            }
            function pcMode() {
                return Module.mcTouchMode !== 1;
            }
            function locked() {
                return document.pointerLockElement === canvas;
            }
            function tryLock() {
                if (!wanted || locked() || !pcMode() || !supported()) return;
                if (escHeld) { lockAfterEsc = true; return; }
                try {
                    lockAskedAt = Date.now();
                    var p = canvas.requestPointerLock();
                    if (p && p.catch) p.catch(function () {   });
                } catch (e) {   }
            }
            function updateHint() {
                var waiting = lockAfterEsc || (lockAskedAt && Date.now() - lockAskedAt < 1500);
                var show = wanted && !locked() && pcMode() && supported() && !waiting;
                if (show && !hint) {
                    hint = document.createElement('div');
                    hint.textContent = 'Click to play';
                    hint.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
                        'z-index:9997;pointer-events:none;font:16px/1.4 monospace;color:#fff;' +
                        'background:rgba(0,0,0,.55);padding:8px 16px;border-radius:3px';
                    document.body.appendChild(hint);
                }
                if (hint) hint.style.display = show ? 'block' : 'none';
            }

            Module.mcPointerWanted = function (on) {
                wanted = !!on;
                if (wanted) tryLock();
                else if (locked() && document.exitPointerLock) document.exitPointerLock();
                updateHint();
            };
            Module.mcMenuOpen = function () {
                if (Module.mcResumePending) return;
                if (wanted || locked()) Module.mcPointerWanted(0);
            };

            window.addEventListener('mousedown', function (e) {
                if (e.target !== canvas || !wanted || locked() || !pcMode() || !supported()) return;
                e.stopImmediatePropagation();
                e.preventDefault();
                swallowUp = e.button;
                clickAttemptAt = Date.now();
                tryLock();
            }, true);
            window.addEventListener('mouseup', function (e) {
                if (e.button !== swallowUp) return;
                swallowUp = -1;
                e.stopImmediatePropagation();
            }, true);

            window.addEventListener('mouseup', function (e) {
                var r = Module.mcResumeRect;
                if (e.button !== 0 || !r || e.target !== canvas || locked() || !pcMode() || !supported()) return;
                var b = canvas.getBoundingClientRect();
                var gw = r[4] || canvas.width, gh = r[5] || canvas.height;
                var x = (e.clientX - b.left) * gw / b.width;
                var y = (e.clientY - b.top) * gh / b.height;
                if (x < r[0] || y < r[1] || x >= r[0] + r[2] || y >= r[1] + r[3]) return;
                wanted = true;
                clickAttemptAt = Date.now();
                tryLock();
                Module.mcResumePending = 1;
            }, true);

            document.addEventListener('pointerlockchange', function () {
                if (locked()) {
                    lockAskedAt = 0;
                    failures = 0;
                    exitAsked = false;
                    if (!wanted && document.exitPointerLock) document.exitPointerLock();
                } else {
                    unlockedAt = Date.now();
                    unlockFlagged = !exitAsked && unlockedAt - escDownAt > 500;
                    lockAskedAt = 0;
                    if (unlockFlagged) Module.mcLockLostByPlayer = 1;
                    exitAsked = false;
                }
                updateHint();
            });
            document.addEventListener('pointerlockerror', function () {
                lockAskedAt = 0;
                var now = Date.now();
                if (now - clickAttemptAt < 1000) {
                    if (failures++ === 0) firstFailureAt = now;
                    if (failures >= 3 && now - firstFailureAt > 2000) {
                        disabled = true;
                        console.warn('Cursor lock unavailable; using drag-to-look controls.');
                    }
                }
                updateHint();
            });
            setInterval(updateHint, 500);
        })();

        (function () {
            var canvas = document.getElementById('canvas');

            canvas.addEventListener('touchstart', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Block document-level default touch behaviours (scroll / zoom),
            // but only for non-input elements (the existing rule).
            document.addEventListener('touchstart', function (e) {
                var t = e.target.tagName;
                if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') {
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('mousedown', function (e) {
                if (e.button === 1) e.preventDefault();
            });
        })();

        (function () {
            var canvas = document.getElementById('canvas');
            function mobileNow() {
                if (Module.mcTouchMode === 1) return true;
                var touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                return touchDevice && coarse;
            }

            var overlay = document.createElement('div');
            overlay.id = 'mc-rotate';
            overlay.textContent = 'Turn your device sideways to play';
            document.body.appendChild(overlay);

            function portrait() { return window.innerHeight > window.innerWidth; }
            function updateOverlay() { overlay.style.display = (mobileNow() && portrait()) ? 'flex' : 'none'; }

            function goLandscape() {
                if (!mobileNow()) return;
                var el = document.documentElement;
                var p = null;
                try {
                    if (!document.fullscreenElement && el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
                } catch (e) {   }
                Promise.resolve(p).then(function () {
                    if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
                }).catch(function () {   });
            }
            window.addEventListener('touchend', goLandscape, true);

            var lastW = 0, lastH = 0, lastAsk = 0;
            function sync() {
                updateOverlay();
                if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
                var b = canvas.getBoundingClientRect();
                var dpr = Module.mcPixelRatio();
                var w = Math.round(b.width * dpr), h = Math.round(b.height * dpr);
                if (w < 1 || h < 1) return;
                if (w === canvas.width && h === canvas.height) return;
                var now = Date.now();
                if (w === lastW && h === lastH && now - lastAsk < 700) return;
                lastW = w; lastH = h; lastAsk = now;
                window.dispatchEvent(new Event('resize'));
            }
            function settle() { sync(); setTimeout(sync, 150); setTimeout(sync, 500); setTimeout(sync, 1200); }
            window.addEventListener('orientationchange', settle);
            window.addEventListener('resize', function () { setTimeout(sync, 50); });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', settle);
            document.addEventListener('fullscreenchange', settle);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) settle(); });
            window.addEventListener('focus', settle);
            window.addEventListener('pageshow', settle);
            setInterval(sync, 1000);
            updateOverlay();
        })();

        Module.mcInstallWorld = function (src, dst, flagKey) {
            Module[flagKey] = 0;
            fetch(src + 'files.json', { cache: 'no-cache' }).then(function (r) {
                if (!r.ok) throw new Error('files.json ' + r.status);
                return r.json();
            }).then(function (files) {
                return Promise.all(files.map(function (rel) {
                    return fetch(src + rel).then(function (r) {
                        if (!r.ok) throw new Error(rel + ' ' + r.status);
                        return r.arrayBuffer();
                    }).then(function (buf) { return { rel: rel, data: new Uint8Array(buf) }; });
                }));
            }).then(function (all) {
                all.forEach(function (fobj) {
                    var path = dst + '/' + fobj.rel;
                    FS.mkdirTree(path.substring(0, path.lastIndexOf('/')));
                    FS.writeFile(path, fobj.data);
                });
                Module[flagKey] = 1;
            }).catch(function (e) {
                console.warn('world install failed:', e);
                Module[flagKey] = -1;
            });
        };

        (function () {
            var open = null;
            Module.mcAskText = function (title, hint, current, maxLen, pendingKey) {
                if (open) return;
                if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
                var overlay = open = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;' +
                    'align-items:center;justify-content:center;z-index:9999;font-family:monospace;padding:16px';
                var box = document.createElement('div');
                box.style.cssText = 'background:#3c3c3c;border:2px solid #888;padding:24px;width:100%;' +
                    'max-width:360px;box-sizing:border-box;color:#eee;text-align:center';
                var h = document.createElement('h2');
                h.style.cssText = 'margin:0 0 10px;color:#fff;font-size:20px;letter-spacing:1px';
                h.textContent = title;
                var pEl = document.createElement('p');
                pEl.style.cssText = 'margin:0 0 16px;font-size:13px;color:#aaa;line-height:1.4';
                pEl.textContent = hint;
                var input = document.createElement('input');
                input.type = 'text'; input.maxLength = maxLen || 32;
                input.autocomplete = 'off'; input.spellcheck = false;
                input.style.cssText = 'width:100%;box-sizing:border-box;padding:8px;background:#222;color:#fff;' +
                    'border:1px solid #666;font-size:16px;font-family:monospace;margin-bottom:16px';
                input.value = current || '';
                var row = document.createElement('div');
                row.style.cssText = 'display:flex;gap:10px;justify-content:center';
                function btn(label, bg) {
                    var b = document.createElement('button');
                    b.textContent = label;
                    b.style.cssText = 'padding:10px 24px;background:' + bg + ';color:#fff;border:none;' +
                        'cursor:pointer;font-size:15px;font-family:monospace';
                    row.appendChild(b);
                    return b;
                }
                var ok = btn('OK', '#4a8a4a'), no = btn('Cancel', '#555');
                box.appendChild(h); box.appendChild(pEl); box.appendChild(input); box.appendChild(row);
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                ['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup', 'click', 'wheel',
                 'touchstart', 'touchend'].forEach(function (t) {
                    overlay.addEventListener(t, function (e) { e.stopPropagation(); });
                });
                function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); open = null; }
                function save() { Module[pendingKey] = input.value.trim(); close(); }
                ok.addEventListener('click', save);
                no.addEventListener('click', close);
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') save();
                    if (e.key === 'Escape') close();
                });
                setTimeout(function () { input.focus(); input.select(); }, 50);
            };
        })();

        (function () {
            function track(e) {
                var ids = [];
                for (var i = 0; i < e.touches.length; i++) ids.push(e.touches[i].identifier);
                Module.mcTouchIds = ids;
            }
            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
                window.addEventListener(t, track, { capture: true, passive: true });
            });
            function none() { Module.mcTouchIds = []; }
            window.addEventListener('blur', none);
            document.addEventListener('visibilitychange', function () { if (document.hidden) none(); });
        })();

        window.addEventListener('keydown', function (e) {
            if ((e.key === 'F5' || e.keyCode === 116) && Module.mcInWorld === 1 && !e.ctrlKey) e.preventDefault();
        }, true);

        (function () {
            var INDEX = 'sounds/index.json';
            var probe = document.createElement('audio');
            var vorbis = probe.canPlayType && probe.canPlayType('audio/ogg; codecs="vorbis"');
            if (!vorbis) return;

            var groups = {}, tracks = [], pools = {}, playing = new Set();
            var overrides = {};
            Module.mcSetSoundOverrides = function (m) { overrides = m || {}; };
            function url(k) { return 'sounds/' + k.split('/').map(encodeURIComponent).join('/'); }
            function add(name, k) { (groups[name] = groups[name] || []).push(url(k)); }
            var VILLAGER_152 = { idle: 'default', hit: 'defaulthurt', death: 'defaultdeath' };

            fetch(INDEX).then(function (r) { return r.json(); }).then(function (idx) {
                var files = idx.files || [], beta = {};
                files.forEach(function (k) {
                    var m = /^newsound\/(.+?)\d*\.ogg$/.exec(k);
                    if (m) {
                        var name = m[1].split('/').join('.');
                        add(name, k);
                        beta[name] = 1;
                    } else if (/^(music|newmusic)\/[^\/]+\.ogg$/.test(k)) {
                        tracks.push(url(k));
                    }
                });
                files.forEach(function (k) {
                    var m = /^sound[34]\/(.+?)\d*\.ogg$/.exec(k);
                    if (m) {
                        var name = m[1].split('/').join('.');
                        if (!beta[name]) add(name, k);
                        return;
                    }
                    var v = /^sound\/mob\/villager\/([a-z]+?)\d*\.ogg$/.exec(k);
                    if (v) {
                        add('mob.villager.' + v[1], k);
                        if (VILLAGER_152[v[1]]) add('mob.villager.' + VILLAGER_152[v[1]], k);
                    }
                });
                Module.mcPlaySound = play;
                Module.mcHasSound = function (name) { return !!((groups[name] && groups[name].length) || (overrides[name] && overrides[name].length)); };
            }).catch(function (e) { console.warn('[sound] classic sounds unavailable:', e); });

            var AC = window.AudioContext || window.webkitAudioContext;
            var actx = null;
            try { if (AC) actx = new AC(); } catch (e) { actx = null; }
            try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
            if (actx) ['touchend', 'mousedown', 'keydown'].forEach(function (t) {
                window.addEventListener(t, function () {
                    if (actx.state !== 'running' && actx.resume) actx.resume().catch(function () {});
                }, { capture: true, passive: true });
            });
            var buffers = {};
            var pendingPlay = {};
            var liveSources = 0;
            function loadBuffer(u) {
                if (buffers[u]) return;
                buffers[u] = 'loading';
                fetch(u).then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.arrayBuffer();
                }).then(function (data) {
                    return new Promise(function (res, rej) { actx.decodeAudioData(data, res, rej); });
                }).then(function (buf) {
                    buffers[u] = buf;
                    var pend = pendingPlay[u];
                    delete pendingPlay[u];
                    if (pend && Date.now() - pend[2] < 600) playBuffer(buf, pend[0], pend[1]);
                }).catch(function () { buffers[u] = 'failed'; delete pendingPlay[u]; });
            }
            function playBuffer(buf, volume, pitch) {
                if (actx.state !== 'running') {
                    if (actx.resume) actx.resume().catch(function () {});
                    return;
                }
                if (liveSources > 32) return;
                var src = actx.createBufferSource();
                src.buffer = buf;
                var rate = Math.max(0.25, Math.min(4, pitch || 1));
                src.playbackRate.value = rate;
                var g = actx.createGain();
                var vol = Math.max(0, Math.min(1, volume)), t = actx.currentTime;
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(vol, t + 0.004);
                src.connect(g);
                g.connect(actx.destination);
                liveSources++;
                var counted = true;
                function done() {
                    if (!counted) return;
                    counted = false;
                    liveSources--;
                    try { src.disconnect(); g.disconnect(); } catch (e) { }
                }
                src.onended = done;
                setTimeout(done, (buf.duration / rate) * 1000 + 1000);
                src.start(t);
            }
            function preloadCommon() {
                if (!actx) return;
                var urls = [];
                Object.keys(groups).forEach(function (n) {
                    if (/^(step|dig|random|damage|liquid|fire|tile)\./.test(n) || /\.step$/.test(n))
                        groups[n].forEach(function (u) { urls.push(u); });
                });
                (function next() {
                    var batch = urls.splice(0, 6);
                    if (!batch.length) return;
                    batch.forEach(loadBuffer);
                    setTimeout(next, 150);
                })();
            }
            setTimeout(preloadCommon, 3000);

            function setPitch(a, pitch) {
                a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = false;
                a.playbackRate = Math.max(0.25, Math.min(4, pitch || 1));
            }
            function play(name, volume, pitch) {
                var list = (overrides[name] && overrides[name].length) ? overrides[name] : groups[name];
                if (!list || !list.length) return false;
                if (playing.size > 24) {
                    playing.forEach(function (el) { if (el.paused || el.ended || el.error) playing.delete(el); });
                    if (playing.size > 24) return true;
                }
                var u = list[(Math.random() * list.length) | 0];
                if (actx) for (var w = 0; w < list.length; w++) loadBuffer(list[w]);
                if (actx) {
                    var b = buffers[u];
                    if (b && b !== 'loading' && b !== 'failed') { playBuffer(b, volume, pitch); return true; }
                    if (b !== 'failed') {
                        loadBuffer(u);
                        pendingPlay[u] = [volume, pitch, Date.now()];
                        return true;
                    }
                }
                var pool = pools[u] || (pools[u] = []);
                for (var j = pool.length - 1; j >= 0; j--) if (pool[j].error) { playing.delete(pool[j]); pool.splice(j, 1); }
                var a = null;
                for (var i = 0; i < pool.length; i++) if (pool[i].paused || pool[i].ended) {
                    a = pool[i];
                    pool.splice(i, 1);
                    pool.push(a);
                    break;
                }
                if (!a) {
                    if (pool.length >= 4) {
                        a = pool.shift();
                        pool.push(a);
                    }
                    else {
                        a = new Audio(u); a.preload = 'auto'; pool.push(a);
                        (function (el, key) {
                            function done() { playing.delete(el); }
