<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="mcre-build" content="dev">
    <title>Minecraft RE</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            /* Prevent browser scroll/zoom on touch */
        }

        canvas.emscripten {
            /* Pinned to the visible window. 100vw/100vh is the *large* viewport on phones (as
               if the address bar were hidden), which differs from what's actually on screen,
               so the picture was stretched or pushed off-centre. The C++ side sizes the
               drawing buffer from this element's real size (see the resize sync below). */
            display: block;
            outline: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #mc-rotate {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font: 18px/1.4 monospace;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })()
        };

        var MCRE_BUILD = (function () {
            var m = document.querySelector('meta[name="mcre-build"]');
            return (m && m.getAttribute('content')) || 'dev';
        })();
        Module.mcBuild = MCRE_BUILD;
        (function () {
            var tag = document.createElement('div');
            tag.textContent = MCRE_BUILD;
            tag.style.cssText = 'position:fixed;left:4px;bottom:2px;font:10px monospace;color:rgba(255,255,255,.5);' +
                'text-shadow:1px 1px 0 rgba(0,0,0,.6);pointer-events:none;user-select:none;z-index:5';
            document.body.appendChild(tag);
        })();

        Module.mcPixelRatio = function () {
            var dpr = window.devicePixelRatio || 1;
            var o = Module.mcRenderScaleOption | 0;
            if (o === 0) {
                var phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                return phone ? Math.max(1, dpr * 0.5) : dpr;
            }
            return dpr * ([1, 1, 0.75, 0.5, 0.35][o] || 1);
        };

        (function () {
            var canvas = document.getElementById('canvas');
            var wanted = false;
            var disabled = false;
            var swallowUp = -1;
            var clickAttemptAt = 0;
            var failures = 0, firstFailureAt = 0;
            var hint = null;

            var exitAsked = false;
            var escHeld = false, escDownAt = -1e9;
            var lockAfterEsc = false;
            var lockAskedAt = 0;
            var unlockedAt = -1e9, unlockFlagged = false;
            if (document.exitPointerLock) {
                var nativeExit = document.exitPointerLock;
                document.exitPointerLock = function () {
                    if (document.pointerLockElement) exitAsked = true;
                    return nativeExit.apply(document, arguments);
                };
            }
            window.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape' || e.repeat) return;
                escHeld = true;
                escDownAt = Date.now();
            }, true);
            window.addEventListener('keyup', function (e) {
                if (e.key !== 'Escape') return;
                if (!escHeld && !unlockFlagged && Date.now() - unlockedAt < 1500) {
                    unlockFlagged = true;
                    Module.mcLockLostByPlayer = 1;
                }
                escHeld = false;
                if (lockAfterEsc) {
                    lockAfterEsc = false;
                    setTimeout(tryLock, 0);
                }
            }, true);
            window.addEventListener('blur', function () { escHeld = false; lockAfterEsc = false; });

            function supported() {
                return !disabled && 'pointerLockElement' in document && !!canvas.requestPointerLock;
            }
            function pcMode() {
                return Module.mcTouchMode !== 1;
            }
            function locked() {
                return document.pointerLockElement === canvas;
            }
            function tryLock() {
                if (!wanted || locked() || !pcMode() || !supported()) return;
                if (escHeld) { lockAfterEsc = true; return; }
                try {
                    lockAskedAt = Date.now();
                    var p = canvas.requestPointerLock();
                    if (p && p.catch) p.catch(function () {   });
                } catch (e) {   }
            }
            function updateHint() {
                var waiting = lockAfterEsc || (lockAskedAt && Date.now() - lockAskedAt < 1500);
                var show = wanted && !locked() && pcMode() && supported() && !waiting;
                if (show && !hint) {
                    hint = document.createElement('div');
                    hint.textContent = 'Click to play';
                    hint.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
                        'z-index:9997;pointer-events:none;font:16px/1.4 monospace;color:#fff;' +
                        'background:rgba(0,0,0,.55);padding:8px 16px;border-radius:3px';
                    document.body.appendChild(hint);
                }
                if (hint) hint.style.display = show ? 'block' : 'none';
            }

            Module.mcPointerWanted = function (on) {
                wanted = !!on;
                if (wanted) tryLock();
                else if (locked() && document.exitPointerLock) document.exitPointerLock();
                updateHint();
            };
            Module.mcMenuOpen = function () {
                if (Module.mcResumePending) return;
                if (wanted || locked()) Module.mcPointerWanted(0);
            };

            window.addEventListener('mousedown', function (e) {
                if (e.target !== canvas || !wanted || locked() || !pcMode() || !supported()) return;
                e.stopImmediatePropagation();
                e.preventDefault();
                swallowUp = e.button;
                clickAttemptAt = Date.now();
                tryLock();
            }, true);
            window.addEventListener('mouseup', function (e) {
                if (e.button !== swallowUp) return;
                swallowUp = -1;
                e.stopImmediatePropagation();
            }, true);

            window.addEventListener('mouseup', function (e) {
                var r = Module.mcResumeRect;
                if (e.button !== 0 || !r || e.target !== canvas || locked() || !pcMode() || !supported()) return;
                var b = canvas.getBoundingClientRect();
                var gw = r[4] || canvas.width, gh = r[5] || canvas.height;
                var x = (e.clientX - b.left) * gw / b.width;
                var y = (e.clientY - b.top) * gh / b.height;
                if (x < r[0] || y < r[1] || x >= r[0] + r[2] || y >= r[1] + r[3]) return;
                wanted = true;
                clickAttemptAt = Date.now();
                tryLock();
                Module.mcResumePending = 1;
            }, true);

            document.addEventListener('pointerlockchange', function () {
                if (locked()) {
                    lockAskedAt = 0;
                    failures = 0;
                    exitAsked = false;
                    if (!wanted && document.exitPointerLock) document.exitPointerLock();
                } else {
                    unlockedAt = Date.now();
                    unlockFlagged = !exitAsked && unlockedAt - escDownAt > 500;
                    lockAskedAt = 0;
                    if (unlockFlagged) Module.mcLockLostByPlayer = 1;
                    exitAsked = false;
                }
                updateHint();
            });
            document.addEventListener('pointerlockerror', function () {
                lockAskedAt = 0;
                var now = Date.now();
                if (now - clickAttemptAt < 1000) {
                    if (failures++ === 0) firstFailureAt = now;
                    if (failures >= 3 && now - firstFailureAt > 2000) {
                        disabled = true;
                        console.warn('Cursor lock unavailable; using drag-to-look controls.');
                    }
                }
                updateHint();
            });
            setInterval(updateHint, 500);
        })();

        (function () {
            var canvas = document.getElementById('canvas');

            canvas.addEventListener('touchstart', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Block document-level default touch behaviours (scroll / zoom),
            // but only for non-input elements (the existing rule).
            document.addEventListener('touchstart', function (e) {
                var t = e.target.tagName;
                if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') {
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('mousedown', function (e) {
                if (e.button === 1) e.preventDefault();
            });
        })();

        (function () {
            var canvas = document.getElementById('canvas');
            function mobileNow() {
                if (Module.mcTouchMode === 1) return true;
                var touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                return touchDevice && coarse;
            }

            var overlay = document.createElement('div');
            overlay.id = 'mc-rotate';
            overlay.textContent = 'Turn your device sideways to play';
            document.body.appendChild(overlay);

            function portrait() { return window.innerHeight > window.innerWidth; }
            function updateOverlay() { overlay.style.display = (mobileNow() && portrait()) ? 'flex' : 'none'; }

            function goLandscape() {
                if (!mobileNow()) return;
                var el = document.documentElement;
                var p = null;
                try {
                    if (!document.fullscreenElement && el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
                } catch (e) {   }
                Promise.resolve(p).then(function () {
                    if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
                }).catch(function () {   });
            }
            window.addEventListener('touchend', goLandscape, true);

            var lastW = 0, lastH = 0, lastAsk = 0;
            function sync() {
                updateOverlay();
                if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
                var b = canvas.getBoundingClientRect();
                var dpr = Module.mcPixelRatio();
                var w = Math.round(b.width * dpr), h = Math.round(b.height * dpr);
                if (w < 1 || h < 1) return;
                if (w === canvas.width && h === canvas.height) return;
                var now = Date.now();
                if (w === lastW && h === lastH && now - lastAsk < 700) return;
                lastW = w; lastH = h; lastAsk = now;
                window.dispatchEvent(new Event('resize'));
            }
            function settle() { sync(); setTimeout(sync, 150); setTimeout(sync, 500); setTimeout(sync, 1200); }
            window.addEventListener('orientationchange', settle);
            window.addEventListener('resize', function () { setTimeout(sync, 50); });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', settle);
            document.addEventListener('fullscreenchange', settle);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) settle(); });
            window.addEventListener('focus', settle);
            window.addEventListener('pageshow', settle);
            setInterval(sync, 1000);
            updateOverlay();
        })();

        Module.mcInstallWorld = function (src, dst, flagKey) {
            Module[flagKey] = 0;
            fetch(src + 'files.json', { cache: 'no-cache' }).then(function (r) {
                if (!r.ok) throw new Error('files.json ' + r.status);
                return r.json();
            }).then(function (files) {
                return Promise.all(files.map(function (rel) {
                    return fetch(src + rel).then(function (r) {
                        if (!r.ok) throw new Error(rel + ' ' + r.status);
                        return r.arrayBuffer();
                    }).then(function (buf) { return { rel: rel, data: new Uint8Array(buf) }; });
                }));
            }).then(function (all) {
                all.forEach(function (fobj) {
                    var path = dst + '/' + fobj.rel;
                    FS.mkdirTree(path.substring(0, path.lastIndexOf('/')));
                    FS.writeFile(path, fobj.data);
                });
                Module[flagKey] = 1;
            }).catch(function (e) {
                console.warn('world install failed:', e);
                Module[flagKey] = -1;
            });
        };

        (function () {
            var open = null;
            Module.mcAskText = function (title, hint, current, maxLen, pendingKey) {
                if (open) return;
                if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
                var overlay = open = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;' +
                    'align-items:center;justify-content:center;z-index:9999;font-family:monospace;padding:16px';
                var box = document.createElement('div');
                box.style.cssText = 'background:#3c3c3c;border:2px solid #888;padding:24px;width:100%;' +
                    'max-width:360px;box-sizing:border-box;color:#eee;text-align:center';
                var h = document.createElement('h2');
                h.style.cssText = 'margin:0 0 10px;color:#fff;font-size:20px;letter-spacing:1px';
                h.textContent = title;
                var pEl = document.createElement('p');
                pEl.style.cssText = 'margin:0 0 16px;font-size:13px;color:#aaa;line-height:1.4';
                pEl.textContent = hint;
                var input = document.createElement('input');
                input.type = 'text'; input.maxLength = maxLen || 32;
                input.autocomplete = 'off'; input.spellcheck = false;
                input.style.cssText = 'width:100%;box-sizing:border-box;padding:8px;background:#222;color:#fff;' +
                    'border:1px solid #666;font-size:16px;font-family:monospace;margin-bottom:16px';
                input.value = current || '';
                var row = document.createElement('div');
                row.style.cssText = 'display:flex;gap:10px;justify-content:center';
                function btn(label, bg) {
                    var b = document.createElement('button');
                    b.textContent = label;
                    b.style.cssText = 'padding:10px 24px;background:' + bg + ';color:#fff;border:none;' +
                        'cursor:pointer;font-size:15px;font-family:monospace';
                    row.appendChild(b);
                    return b;
                }
                var ok = btn('OK', '#4a8a4a'), no = btn('Cancel', '#555');
                box.appendChild(h); box.appendChild(pEl); box.appendChild(input); box.appendChild(row);
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                ['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup', 'click', 'wheel',
                 'touchstart', 'touchend'].forEach(function (t) {
                    overlay.addEventListener(t, function (e) { e.stopPropagation(); });
                });
                function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); open = null; }
                function save() { Module[pendingKey] = input.value.trim(); close(); }
                ok.addEventListener('click', save);
                no.addEventListener('click', close);
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') save();
                    if (e.key === 'Escape') close();
                });
                setTimeout(function () { input.focus(); input.select(); }, 50);
            };
        })();

        (function () {
            function track(e) {
                var ids = [];
                for (var i = 0; i < e.touches.length; i++) ids.push(e.touches[i].identifier);
                Module.mcTouchIds = ids;
            }
            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
                window.addEventListener(t, track, { capture: true, passive: true });
            });
            function none() { Module.mcTouchIds = []; }
            window.addEventListener('blur', none);
            document.addEventListener('visibilitychange', function () { if (document.hidden) none(); });
        })();

        window.addEventListener('keydown', function (e) {
            if ((e.key === 'F5' || e.keyCode === 116) && Module.mcInWorld === 1 && !e.ctrlKey) e.preventDefault();
        }, true);

        (function () {
            var INDEX = 'sounds/index.json';
            var probe = document.createElement('audio');
            var vorbis = probe.canPlayType && probe.canPlayType('audio/ogg; codecs="vorbis"');
            if (!vorbis) return;

            var groups = {}, tracks = [], pools = {}, playing = new Set();
            var overrides = {};
            Module.mcSetSoundOverrides = function (m) { overrides = m || {}; };
            function url(k) { return 'sounds/' + k.split('/').map(encodeURIComponent).join('/'); }
            function add(name, k) { (groups[name] = groups[name] || []).push(url(k)); }
            var VILLAGER_152 = { idle: 'default', hit: 'defaulthurt', death: 'defaultdeath' };

            fetch(INDEX).then(function (r) { return r.json(); }).then(function (idx) {
                var files = idx.files || [], beta = {};
                files.forEach(function (k) {
                    var m = /^newsound\/(.+?)\d*\.ogg$/.exec(k);
                    if (m) {
                        var name = m[1].split('/').join('.');
                        add(name, k);
                        beta[name] = 1;
                    } else if (/^(music|newmusic)\/[^\/]+\.ogg$/.test(k)) {
                        tracks.push(url(k));
                    }
                });
                files.forEach(function (k) {
                    var m = /^sound[34]\/(.+?)\d*\.ogg$/.exec(k);
                    if (m) {
                        var name = m[1].split('/').join('.');
                        if (!beta[name]) add(name, k);
                        return;
                    }
                    var v = /^sound\/mob\/villager\/([a-z]+?)\d*\.ogg$/.exec(k);
                    if (v) {
                        add('mob.villager.' + v[1], k);
                        if (VILLAGER_152[v[1]]) add('mob.villager.' + VILLAGER_152[v[1]], k);
                    }
                });
                Module.mcPlaySound = play;
                Module.mcHasSound = function (name) { return !!((groups[name] && groups[name].length) || (overrides[name] && overrides[name].length)); };
            }).catch(function (e) { console.warn('[sound] classic sounds unavailable:', e); });

            var AC = window.AudioContext || window.webkitAudioContext;
            var actx = null;
            try { if (AC) actx = new AC(); } catch (e) { actx = null; }
            try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
            if (actx) ['touchend', 'mousedown', 'keydown'].forEach(function (t) {
                window.addEventListener(t, function () {
                    if (actx.state !== 'running' && actx.resume) actx.resume().catch(function () {});
                }, { capture: true, passive: true });
            });
            var buffers = {};
            var pendingPlay = {};
            var liveSources = 0;
            function loadBuffer(u) {
                if (buffers[u]) return;
                buffers[u] = 'loading';
                fetch(u).then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.arrayBuffer();
                }).then(function (data) {
                    return new Promise(function (res, rej) { actx.decodeAudioData(data, res, rej); });
                }).then(function (buf) {
                    buffers[u] = buf;
                    var pend = pendingPlay[u];
                    delete pendingPlay[u];
                    if (pend && Date.now() - pend[2] < 600) playBuffer(buf, pend[0], pend[1]);
                }).catch(function () { buffers[u] = 'failed'; delete pendingPlay[u]; });
            }
            function playBuffer(buf, volume, pitch) {
                if (actx.state !== 'running') {
                    if (actx.resume) actx.resume().catch(function () {});
                    return;
                }
                if (liveSources > 32) return;
                var src = actx.createBufferSource();
                src.buffer = buf;
                var rate = Math.max(0.25, Math.min(4, pitch || 1));
                src.playbackRate.value = rate;
                var g = actx.createGain();
                var vol = Math.max(0, Math.min(1, volume)), t = actx.currentTime;
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(vol, t + 0.004);
                src.connect(g);
                g.connect(actx.destination);
                liveSources++;
                var counted = true;
                function done() {
                    if (!counted) return;
                    counted = false;
                    liveSources--;
                    try { src.disconnect(); g.disconnect(); } catch (e) { }
                }
                src.onended = done;
                setTimeout(done, (buf.duration / rate) * 1000 + 1000);
                src.start(t);
            }
            function preloadCommon() {
                if (!actx) return;
                var urls = [];
                Object.keys(groups).forEach(function (n) {
                    if (/^(step|dig|random|damage|liquid|fire|tile)\./.test(n) || /\.step$/.test(n))
                        groups[n].forEach(function (u) { urls.push(u); });
                });
                (function next() {
                    var batch = urls.splice(0, 6);
                    if (!batch.length) return;
                    batch.forEach(loadBuffer);
                    setTimeout(next, 150);
                })();
            }
            setTimeout(preloadCommon, 3000);

            function setPitch(a, pitch) {
                a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = false;
                a.playbackRate = Math.max(0.25, Math.min(4, pitch || 1));
            }
            function play(name, volume, pitch) {
                var list = (overrides[name] && overrides[name].length) ? overrides[name] : groups[name];
                if (!list || !list.length) return false;
                if (playing.size > 24) {
                    playing.forEach(function (el) { if (el.paused || el.ended || el.error) playing.delete(el); });
                    if (playing.size > 24) return true;
                }
                var u = list[(Math.random() * list.length) | 0];
                if (actx) for (var w = 0; w < list.length; w++) loadBuffer(list[w]);
                if (actx) {
                    var b = buffers[u];
                    if (b && b !== 'loading' && b !== 'failed') { playBuffer(b, volume, pitch); return true; }
                    if (b !== 'failed') {
                        loadBuffer(u);
                        pendingPlay[u] = [volume, pitch, Date.now()];
                        return true;
                    }
                }
                var pool = pools[u] || (pools[u] = []);
                for (var j = pool.length - 1; j >= 0; j--) if (pool[j].error) { playing.delete(pool[j]); pool.splice(j, 1); }
                var a = null;
                for (var i = 0; i < pool.length; i++) if (pool[i].paused || pool[i].ended) {
                    a = pool[i];
                    pool.splice(i, 1);
                    pool.push(a);
                    break;
                }
                if (!a) {
                    if (pool.length >= 4) {
                        a = pool.shift();
                        pool.push(a);
                    }
                    else {
                        a = new Audio(u); a.preload = 'auto'; pool.push(a);
                        (function (el, key) {
                            function done() { playing.delete(el); }
                            el.addEventListener('ended', done);
                            el.addEventListener('pause', done);
                            el.addEventListener('error', function () {
                                playing.delete(el);
                                var p = pools[key], k = p ? p.indexOf(el) : -1;
                                if (k >= 0) p.splice(k, 1);
                            });
                            el.addEventListener('playing', function () { playing.add(el); });
                        })(a, u);
                    }
                }
                try {
                    a.currentTime = 0;
                    a.volume = Math.max(0, Math.min(1, volume));
                    setPitch(a, pitch);
                    var p = a.play();
                    playing.add(a);
                    if (p && p.catch) p.catch(function () { playing.delete(a); });
                } catch (e) {   }
                return true;
            }

            var music = null, nextAt = Date.now() + (30 + Math.random() * 60) * 1000;
            setInterval(function () {
                var vol = typeof Module.mcMusicVolume === 'number' ? Module.mcMusicVolume : 1;
                var want = Module.mcInWorld === 1 && vol > 0 && !document.hidden && tracks.length;
                if (music) {
                    if (!want) { music.pause(); }
                    else { music.volume = vol; if (music.paused && !music.ended) music.play().catch(function () {}); }
                    if (music.ended) { music = null; nextAt = Date.now() + (10 + Math.random() * 10) * 60 * 1000; }
                    return;
                }
                if (want && Date.now() >= nextAt) {
                    music = new Audio(tracks[(Math.random() * tracks.length) | 0]);
                    music.volume = vol;
                    music.play().catch(function () { music = null; nextAt = Date.now() + 30000; });
                }
            }, 1000);
        })();

        (function () {
            var CACHE_KEY = 'mcre-skin-v1';
            var overlay = null, askedThisLoad = false, loadedFor = null, serial = 0;

            function valid(n) { return /^[A-Za-z0-9_]{3,16}$/.test(n); }

            function fetchJson(url) {
                return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
            }
            function httpsUrl(u) { return u ? String(u).replace(/^http:/, 'https:') : null; }

            function lookup(name) {
                var enc = encodeURIComponent(name);

                    } catch (x) { console.warn('[mods] scripts could not start', x); worker = null; return; }
                    worker.onmessage = onWorker;
                    worker.onerror = function (x) { console.warn('[mods] script error', x.message); chat('[mods] script error: ' + x.message); };
                    worker.postMessage({ t: 'load', scripts: scripts, store: side === 'host' ? loadStore() : {}, host: side === 'host' });
                    if (side === 'host') toWorker({ t: 'start', folder: folder, dimension: e.dimension, player: me });
                    toWorker({ t: 'start', client: true, dimension: e.dimension, player: me });
                    return;
                }
                if (e.t === 'stop') {
                    toWorker({ t: 'stop', client: true });
                    if (side === 'host') toWorker(e);
                    if (stopTimer) clearTimeout(stopTimer);
                    stopTimer = setTimeout(function () { stopTimer = 0; stop(); }, 300);
                    return;
                }
                if (e.t === 'ctick') { e.t = 'tick'; e.client = true; if (e.player) me = e.player; }
                else if (e.t === 'reply' && remoteReq[e.req]) {
                    var rr = remoteReq[e.req]; delete remoteReq[e.req];
                    if (typeof e.block === 'string') e.block = nameOf(e.block);
                    e.req = rr.req;
                    if (net().sendCtlTo) net().sendCtlTo(rr.guid, { t: 'reply', e: e });
                    return;
                }
                toWorker(e);
            };
            function stop() {
                if (worker) { try { worker.terminate(); } catch (x) { } }
                worker = null; side = ''; actions = []; known = {}; wants = {}; remoteReq = {};
                closeGui();
                hud(null);
            }
            api.command = function (text, playerJson) {
                if (joined()) {
                    if (!worker || !net().sendCtlHost) return false;
                    net().sendCtlHost({ t: 'cmd', text: String(text).slice(0, 500) });
                    return true;
                }
                if (!worker || side !== 'host') return false;
                var p = null;
                try { p = JSON.parse(playerJson); } catch (x) { }
                toWorker({ t: 'command', text: String(text), player: p });
                return true;
            };
            api.tpRemote = function (guid, x, y, z) {
                if (side === 'host' && net().isOpen && net().isOpen(guid)) net().sendCtlTo(guid, { t: 'tp', x: x, y: y, z: z });
            };
            api.fromJoiner = function (guid, msg) {
                if (!worker || side !== 'host' || !msg) return;
                var p = null;
                try { p = JSON.parse(UTF8ToString(Module._mcPlayerByGuid(guid))); } catch (x) { }
                if (!p) return;
                known[p.id] = p;
                var ownMod = function (id) { return W() && W().scripts(false).some(function (s) { return s.mod === id; }); };
                switch (msg.t) {
                case 'cmd': toWorker({ t: 'command', text: String(msg.text || ''), player: p }); break;
                case 'guiev': toWorker({ t: 'gui', mod: msg.mod, gui: msg.gui, action: msg.action, id: msg.id, values: msg.values || {}, player: p }); break;
                case 'csend': if (ownMod(msg.mod)) toWorker({ t: 'message', mod: msg.mod, data: msg.data, player: p }); break;
                case 'sact': if (ownMod(msg.mod)) runAct(msg.mod, msg.a, guid); break;
                case 'sgui': if (ownMod(msg.mod)) serverGui(msg.mod, !!msg.open, known[msg.player], msg.spec || {}); break;
                case 'ssend': if (ownMod(msg.mod)) sendToPlayer(msg.mod, msg.player, msg.data); break;
                }
            };
            api.fromHost = function (msg) {
                if (!msg) return;
                switch (msg.t) {
                case 'gui': showGui(msg.spec || {}, function (ev) { if (net().sendCtlHost) net().sendCtlHost(Object.assign(ev, { t: 'guiev' })); }); break;
                case 'guiClose': closeGui(); break;
                case 'tp': if (Module._mcScriptTeleport) Module._mcScriptTeleport(+msg.x || 0, +msg.y || 0, +msg.z || 0); break;
                case 'give': if (Module._mcScriptGive) Module.ccall('mcScriptGive', null, ['string', 'number'], [String(msg.ref || ''), msg.n | 0]); break;
                case 'heal': if (Module._mcScriptHeal) Module._mcScriptHeal(msg.n | 0); break;
                case 'sound': if (Module._mcScriptSound) Module.ccall('mcScriptSound', null, ['string', 'number', 'number', 'number', 'number', 'number'], [String(msg.name || ''), +msg.x, +msg.y, +msg.z, +msg.v || 1, +msg.p || 1]); break;
                case 'cmsg': toWorker({ t: 'message', client: true, mod: msg.mod, data: msg.data }); break;
                case 'reply': if (msg.e) toWorker(msg.e); break;
                }
            };

            function onKey(e) {
                if (!worker || !wants.key || e.repeat || gui) return;
                var t = e.target;
                if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                toWorker({ t: 'key', client: true, key: e.key, code: e.code, down: e.type === 'keydown' });
            }
            window.addEventListener('keydown', onKey);
            window.addEventListener('keyup', onKey);

            var hudBox = null, hudLines = {};
            function hud(key, text) {
                if (key === null) { hudLines = {}; if (hudBox) hudBox.innerHTML = ''; return; }
                if (text === null || text === '') delete hudLines[key];
                else hudLines[key] = String(text).slice(0, 200);
                if (!hudBox) {
                    hudBox = document.createElement('div');
                    hudBox.style.cssText = 'position:fixed;right:8px;top:8px;z-index:6;pointer-events:none;font:13px monospace;' +
                        'color:#fff;text-shadow:1px 1px 0 #000;text-align:right;max-width:45vw';
                    document.body.appendChild(hudBox);
                }
                hudBox.innerHTML = '';
                Object.keys(hudLines).forEach(function (k) {
                    var l = document.createElement('div');
                    l.textContent = hudLines[k];
                    l.style.cssText = 'margin-bottom:2px;white-space:pre-wrap';
                    hudBox.appendChild(l);
                });
            }

            var gui = null;
            function closeGui() {
                if (gui && gui.el && gui.el.parentNode) gui.el.parentNode.removeChild(gui.el);
                gui = null;
            }
            function showGui(spec, send) {
                closeGui();
                if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
                var color = function (c, dflt) { return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : dflt; };
                var ov = document.createElement('div');
                ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;' +
                    'justify-content:center;z-index:9998;font-family:monospace;padding:16px;box-sizing:border-box';
                var box = document.createElement('div');
                box.style.cssText = 'background:#3c3c3c;border:2px solid #888;padding:18px;width:100%;max-width:' +
                    Math.max(200, Math.min(640, (spec.width | 0) || 380)) + 'px;box-sizing:border-box;color:#eee;' +
                    'max-height:90vh;overflow:auto';
                ov.appendChild(box);
                ['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup', 'click', 'wheel', 'touchstart', 'touchend', 'touchmove'].forEach(function (t) {
                    ov.addEventListener(t, function (e) { e.stopPropagation(); });
                });
                var inputs = {};
                var values = function () { var v = {}; Object.keys(inputs).forEach(function (k) { v[k] = inputs[k].value; }); return v; };
                var emit = function (action, id) { send({ mod: spec._mod, gui: String(spec.id || ''), action: action, id: id || '', values: values() }); };
                if (spec.title) {
                    var h = document.createElement('h2');
                    h.style.cssText = 'margin:0 0 12px;color:#fff;font-size:18px;text-align:center';
                    h.textContent = String(spec.title).slice(0, 80);
                    box.appendChild(h);
                }
                function add(parent, el, inRow) {
                    if (!el || typeof el !== 'object') return;
                    var t = el.type, node;
                    if (t === 'text') {
                        node = document.createElement('div');
                        node.textContent = String(el.text == null ? '' : el.text).slice(0, 2000);
                        node.style.cssText = 'margin:4px 0;font-size:14px;line-height:1.4;white-space:pre-wrap;color:' + color(el.color, '#ddd');
                    } else if (t === 'button') {
                        node = document.createElement('button');
                        node.textContent = String(el.text == null ? '' : el.text).slice(0, 60);
                        node.style.cssText = 'padding:9px 14px;margin:4px;background:' + color(el.color, '#5a5a5a') +
                            ';color:#fff;border:2px solid #222;cursor:pointer;font-size:14px;font-family:monospace;' + (inRow ? 'flex:1' : 'width:calc(100% - 8px)');
                        node.onclick = function () { emit('click', String(el.id || '')); };
                    } else if (t === 'input') {
                        node = document.createElement('input');
                        node.type = 'text';
                        node.value = String(el.value == null ? '' : el.value).slice(0, 500);
                        node.placeholder = String(el.placeholder || '').slice(0, 100);
                        node.style.cssText = 'padding:8px;margin:4px;background:#222;color:#fff;border:1px solid #666;font-size:14px;font-family:monospace;box-sizing:border-box;' + (inRow ? 'flex:1;min-width:0' : 'width:calc(100% - 8px)');
                        inputs[String(el.id || ('input' + Object.keys(inputs).length))] = node;
                        node.addEventListener('keydown', function (e) { if (e.key === 'Enter') emit('submit', String(el.id || '')); });
                    } else if (t === 'row') {
                        node = document.createElement('div');
                        node.style.cssText = 'display:flex;gap:4px;align-items:center';
                        (el.elements || []).slice(0, 12).forEach(function (c) { add(node, c, true); });
                    } else if (t === 'divider') {
                        node = document.createElement('hr');
                        node.style.cssText = 'border:0;border-top:1px solid #666;margin:10px 0';
                    } else return;
                    parent.appendChild(node);
                }
                (spec.elements || []).slice(0, 64).forEach(function (el) { add(box, el, false); });
                var close = function () { emit('close'); closeGui(); };
                if (spec.closeButton !== false) {
                    var c = document.createElement('button');
                    c.textContent = 'Close';
                    c.style.cssText = 'display:block;margin:12px auto 0;padding:8px 22px;background:#555;color:#fff;border:none;cursor:pointer;font-family:monospace';
                    c.onclick = close;
                    box.appendChild(c);
                }
                ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
                ov.tabIndex = -1;
                document.body.appendChild(ov);
                var refocus = gui === null && lastGui && lastGui.id === spec.id ? lastGui.focus : null;
                setTimeout(function () {
                    var target = (refocus && inputs[refocus]) || box.querySelector('input');
                    (target || ov).focus();
                }, 30);
                gui = { id: spec.id, el: ov };
                lastGui = { id: spec.id, focus: null };
                Object.keys(inputs).forEach(function (k) { inputs[k].addEventListener('focus', function () { if (lastGui) lastGui.focus = k; }); });
            }
            var lastGui = null;
        })();
    </script>

    <script type='text/javascript'>
        (function () {
            var FAIL_KEY = 'mcre-mt-failed';
            var tpl = document.getElementById('mcre-game-script');
            var tag = tpl && tpl.content ? tpl.content.querySelector('script') : null;
            var normal = (tag && tag.getAttribute('src')) || 'index.js';
            var threaded = normal.replace(/\.js$/, '_mt.js');
            var query = location.search;

            function recentFailure() {
                if (/[?&]mt=1(&|$)/.test(query)) return false;
                try {
                    var t = +localStorage.getItem(FAIL_KEY);
                    return t > 0 && Date.now() - t < 3 * 24 * 3600 * 1000;
                } catch (e) { return false; }
            }
            var appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent)
                || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
            function canThread() {
                if (/[?&]mt=0(&|$)/.test(query)) return false;
                if (appleTouch && !/[?&]mt=1(&|$)/.test(query)) return false;
                if (!window.crossOriginIsolated) return false;
                if (typeof SharedArrayBuffer !== 'function' || typeof Atomics !== 'object') return false;
                try {
                    var mem = new WebAssembly.Memory({ initial: 1, maximum: 2, shared: true });
                    if (typeof mem.toResizableBuffer !== 'function') return false;
                    mem.toResizableBuffer();
                } catch (e) { return false; }
                return !recentFailure();
            }
            function add(src, onFail) {
                var el = document.createElement('script');
                el.src = src;
                el.async = true;
                if (onFail) el.onerror = onFail;
                document.body.appendChild(el);
            }

            if (!canThread()) {
                Module.mcThreaded = 0;
                add(normal);
                return;
            }
            var cores = navigator.hardwareConcurrency || 2;
            var phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            Module.mcMeshThreads = Math.max(1, Math.min(phone ? 2 : 3, cores - 1));
            Module.mcThreaded = 1;

            var started = false, settled = false;
            Module.postRun = Module.postRun || [];
            if (typeof Module.postRun === 'function') Module.postRun = [Module.postRun];
            Module.postRun.push(function () { started = true; });
            function giveUp(why) {
                if (started || settled) return;
                settled = true;
                console.warn('Threaded build failed to start (' + why + '); switching to the normal build.');
                try { localStorage.setItem(FAIL_KEY, String(Date.now())); } catch (e) { }
                location.reload();
            }
            var prevAbort = Module.onAbort;
            Module.onAbort = function (what) {
                if (prevAbort) { try { prevAbort(what); } catch (e) { } }
                giveUp('abort: ' + what);
            };
            window.addEventListener('error', function (e) {
                if (e && e.filename && e.filename.indexOf(threaded) !== -1) giveUp(e.message || 'error');
            });
            var STALL_MS = 30000;
            var lastProgress = Date.now();
            function progress() { lastProgress = Date.now(); }
            var prevStatus = Module.setStatus;
            Module.setStatus = function (text) {
                progress();
                if (prevStatus) return prevStatus.apply(this, arguments);
            };
            var prevDeps = Module.monitorRunDependencies;
            Module.monitorRunDependencies = function (left) {
                progress();
                if (prevDeps) return prevDeps.apply(this, arguments);
            };
            var watchdog = setInterval(function () {
                if (started || settled) { clearInterval(watchdog); return; }
                if (Date.now() - lastProgress > STALL_MS) {
                    clearInterval(watchdog);
                    giveUp('no progress for ' + (STALL_MS / 1000) + ' s');
                }
            }, 1000);
            add(threaded, function () {
                if (started || settled) return;
                settled = true;
                Module.mcThreaded = 0;
                add(normal);
            });
        })();
    </script>

                 'touchstart', 'touchmove', 'touchend'].forEach(function (t) {
