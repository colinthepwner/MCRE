<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Minecraft</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            /* Prevent browser scroll/zoom on touch */
        }

        canvas.emscripten {
            /* Pinned to the visible window. 100vw/100vh is the *large* viewport on phones (as
               if the address bar were hidden), which differs from what's actually on screen,
               so the picture was stretched or pushed off-centre. The C++ side sizes the
               drawing buffer from this element's real size (see the resize sync below). */
            display: block;
            outline: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #mc-rotate {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font: 18px/1.4 monospace;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })()
        };

        (function () {
            var canvas = document.getElementById('canvas');
            var wanted = false;
            var disabled = false;
            var swallowUp = -1;
            var clickAttemptAt = 0;
            var failures = 0, firstFailureAt = 0;
            var hint = null;

            function supported() {
                return !disabled && 'pointerLockElement' in document && !!canvas.requestPointerLock;
            }
            function pcMode() {
                return Module.mcTouchMode !== 1;
            }
            function locked() {
                return document.pointerLockElement === canvas;
            }
            function tryLock() {
                if (!wanted || locked() || !pcMode() || !supported()) return;
                try {
                    var p = canvas.requestPointerLock();
                    if (p && p.catch) p.catch(function () {   });
                } catch (e) {   }
            }
            function updateHint() {
                var show = wanted && !locked() && pcMode() && supported();
                if (show && !hint) {
                    hint = document.createElement('div');
                    hint.textContent = 'Click to play';
                    hint.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);' +
                        'z-index:9997;pointer-events:none;font:16px/1.4 monospace;color:#fff;' +
                        'background:rgba(0,0,0,.55);padding:8px 16px;border-radius:3px';
                    document.body.appendChild(hint);
                }
                if (hint) hint.style.display = show ? 'block' : 'none';
            }

            Module.mcPointerWanted = function (on) {
                wanted = !!on;
                if (wanted) tryLock();
                else if (locked() && document.exitPointerLock) document.exitPointerLock();
                updateHint();
            };
            Module.mcMenuOpen = function () {
                if (Module.mcResumePending) return;
                if (wanted || locked()) Module.mcPointerWanted(0);
            };

            window.addEventListener('mousedown', function (e) {
                if (e.target !== canvas || !wanted || locked() || !pcMode() || !supported()) return;
                e.stopImmediatePropagation();
                e.preventDefault();
                swallowUp = e.button;
                clickAttemptAt = Date.now();
                tryLock();
            }, true);
            window.addEventListener('mouseup', function (e) {
                if (e.button !== swallowUp) return;
                swallowUp = -1;
                e.stopImmediatePropagation();
            }, true);

            window.addEventListener('mouseup', function (e) {
                var r = Module.mcResumeRect;
                if (e.button !== 0 || !r || e.target !== canvas || locked() || !pcMode() || !supported()) return;
                var b = canvas.getBoundingClientRect();
                var gw = r[4] || canvas.width, gh = r[5] || canvas.height;
                var x = (e.clientX - b.left) * gw / b.width;
                var y = (e.clientY - b.top) * gh / b.height;
                if (x < r[0] || y < r[1] || x >= r[0] + r[2] || y >= r[1] + r[3]) return;
                e.stopImmediatePropagation();
                wanted = true;
                clickAttemptAt = Date.now();
                tryLock();
                Module.mcResumePending = 1;
            }, true);

            document.addEventListener('pointerlockchange', function () {
                if (locked()) failures = 0;
                updateHint();
            });
            document.addEventListener('pointerlockerror', function () {
                var now = Date.now();
                if (now - clickAttemptAt < 1000) {
                    if (failures++ === 0) firstFailureAt = now;
                    if (failures >= 3 && now - firstFailureAt > 2000) {
                        disabled = true;
                        console.warn('Cursor lock unavailable; using drag-to-look controls.');
                    }
                }
                updateHint();
            });
            setInterval(updateHint, 500);
        })();

        (function () {
            var canvas = document.getElementById('canvas');

            canvas.addEventListener('touchstart', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Block document-level default touch behaviours (scroll / zoom),
            // but only for non-input elements (the existing rule).
            document.addEventListener('touchstart', function (e) {
                var t = e.target.tagName;
                if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') {
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('mousedown', function (e) {
                if (e.button === 1) e.preventDefault();
            });
        })();

        (function () {
            var canvas = document.getElementById('canvas');
            function mobileNow() {
                if (Module.mcTouchMode === 1) return true;
                var touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                return touchDevice && coarse;
            }

            var overlay = document.createElement('div');
            overlay.id = 'mc-rotate';
            overlay.textContent = 'Turn your device sideways to play';
            document.body.appendChild(overlay);

            function portrait() { return window.innerHeight > window.innerWidth; }
            function updateOverlay() { overlay.style.display = (mobileNow() && portrait()) ? 'flex' : 'none'; }

            function goLandscape() {
                if (!mobileNow()) return;
                var el = document.documentElement;
                var p = null;
                try {
                    if (!document.fullscreenElement && el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
                } catch (e) {   }
                Promise.resolve(p).then(function () {
                    if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
                }).catch(function () {   });
            }
            window.addEventListener('touchend', goLandscape, true);

            var lastW = 0, lastH = 0;
            function sync() {
                updateOverlay();
                var b = canvas.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                var w = Math.round(b.width * dpr), h = Math.round(b.height * dpr);
                if (w < 1 || h < 1) return;
                if (w === canvas.width && h === canvas.height) { lastW = w; lastH = h; return; }
                if (w === lastW && h === lastH) return;
                lastW = w; lastH = h;
                window.dispatchEvent(new Event('resize'));
            }
            function settle() { sync(); setTimeout(sync, 150); setTimeout(sync, 500); setTimeout(sync, 1200); }
            window.addEventListener('orientationchange', settle);
            window.addEventListener('resize', function () { setTimeout(sync, 50); });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', settle);
            document.addEventListener('fullscreenchange', settle);
            setInterval(sync, 1000);
            updateOverlay();
        })();
    </script>
    <script type='text/javascript'>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
    <script src="saves.js"></script>
    {{{ SCRIPT }}}
</body>

</html>
